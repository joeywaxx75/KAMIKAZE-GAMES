<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KAMIKAZE GAMES</title>
    <style>
      :root {
        --void: #02030a;
        --ice: #e9f4ff;
        --blue: #3b82ff;
        --cyan: #00e7ff;
        --red: #ff1e4d;
        --purple: #a855ff;
        --green: #24ff9a;
        --line: rgba(101, 172, 255, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ice);
        background: var(--void);
        font-family: "Orbitron", "Eurostile", "Bank Gothic", "Arial Black", Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 28px;
        background:
          linear-gradient(90deg, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0.18) 54%, rgba(0, 0, 0, 0.72)),
          url("./kmk.png") center / cover no-repeat;
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(1, 3, 12, 0.08), rgba(1, 3, 12, 0.70)),
          radial-gradient(circle at 72% 36%, rgba(0, 231, 255, 0.22), transparent 30%),
          radial-gradient(circle at 30% 68%, rgba(255, 30, 77, 0.18), transparent 28%);
        pointer-events: none;
      }

      main {
        position: relative;
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
        gap: 24px;
        align-items: end;
      }

      .hero,
      .progress-card {
        background: transparent;
      }

      .hero {
        padding: clamp(28px, 6vw, 64px);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 30px;
        color: var(--cyan);
        text-shadow:
          0 0 10px rgba(0, 231, 255, 0.95),
          0 0 24px rgba(168, 85, 255, 0.82);
      }

      .mark::before {
        content: "";
        width: 34px;
        height: 10px;
        background: linear-gradient(90deg, var(--red), var(--purple), var(--cyan));
        border-radius: 999px;
        box-shadow:
          0 0 12px rgba(255, 30, 77, 0.9),
          0 0 24px rgba(0, 231, 255, 0.72);
      }

      h1 {
        margin: 0;
        font-size: clamp(46px, 9vw, 104px);
        line-height: 0.88;
        text-transform: uppercase;
        color: transparent;
        background: linear-gradient(105deg, #ffffff 0%, var(--cyan) 24%, var(--blue) 45%, var(--purple) 68%, var(--red) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-stroke: 1px rgba(233, 244, 255, 0.72);
        text-shadow:
          0 0 10px rgba(59, 130, 255, 0.9),
          0 0 26px rgba(0, 231, 255, 0.65),
          0 0 44px rgba(168, 85, 255, 0.72),
          0 0 68px rgba(255, 30, 77, 0.44);
      }

      .subline {
        margin: 28px 0 0;
        max-width: 620px;
        font-size: clamp(18px, 3vw, 30px);
        line-height: 1.08;
        font-weight: 800;
        text-transform: uppercase;
        color: #f8fbff;
        text-shadow:
          0 0 10px rgba(0, 231, 255, 0.76),
          0 0 28px rgba(168, 85, 255, 0.68);
      }

      .arrows {
        display: block;
        color: var(--red);
        margin: 14px 0;
        font-size: 30px;
        text-shadow:
          0 0 8px rgba(255, 30, 77, 0.96),
          0 0 24px rgba(168, 85, 255, 0.76);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 6px;
        color: #ffffff;
        border: 1px solid rgba(0, 231, 255, 0.74);
        background:
          linear-gradient(90deg, rgba(255, 30, 77, 0.86), rgba(168, 85, 255, 0.88), rgba(0, 231, 255, 0.86));
        text-decoration: none;
        font-weight: 800;
        text-transform: uppercase;
        box-shadow:
          0 0 16px rgba(0, 231, 255, 0.72),
          0 0 34px rgba(168, 85, 255, 0.54),
          inset 0 0 18px rgba(255, 255, 255, 0.16);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        transition: transform 160ms ease, filter 160ms ease;
      }

      a.button:hover {
        transform: translateY(-2px);
        filter: brightness(1.18) saturate(1.2);
      }

      .progress-card {
        position: relative;
        padding: 24px;
        border: 1px solid rgba(0, 231, 255, 0.54);
        background: rgba(1, 4, 18, 0.58);
        backdrop-filter: blur(10px);
        box-shadow:
          0 0 20px rgba(0, 231, 255, 0.30),
          0 0 42px rgba(168, 85, 255, 0.20),
          inset 0 0 28px rgba(59, 130, 255, 0.14);
      }

      .progress-card::before,
      .progress-card::after {
        content: "";
        position: absolute;
        width: 38px;
        height: 38px;
        border-color: var(--red);
        border-style: solid;
        filter: drop-shadow(0 0 10px rgba(255, 30, 77, 0.88));
      }

      .progress-card::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }

      .progress-card::after {
        right: -1px;
        bottom: -1px;
        border-width: 0 2px 2px 0;
      }

      .progress-card h2 {
        margin: 0 0 18px;
        font-size: 20px;
        text-transform: uppercase;
        color: var(--cyan);
        text-shadow:
          0 0 10px rgba(0, 231, 255, 0.88),
          0 0 22px rgba(59, 130, 255, 0.58);
      }

      .amount {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .amount strong {
        font-size: 34px;
        color: #ffffff;
        text-shadow:
          0 0 12px rgba(255, 255, 255, 0.70),
          0 0 24px rgba(0, 231, 255, 0.62);
      }

      .meter {
        height: 16px;
        border: 1px solid rgba(0, 231, 255, 0.58);
        background: rgba(0, 0, 0, 0.42);
        overflow: hidden;
        margin: 16px 0 18px;
        box-shadow: inset 0 0 12px rgba(0, 231, 255, 0.24);
      }

      .fill {
        height: 100%;
        width: var(--progress);
        background: linear-gradient(90deg, var(--red), var(--purple), var(--cyan), var(--green));
        box-shadow:
          0 0 12px rgba(0, 231, 255, 0.82),
          0 0 22px rgba(168, 85, 255, 0.62);
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat {
        border-top: 1px solid rgba(101, 172, 255, 0.36);
        padding-top: 12px;
      }

      .stat span {
        display: block;
        font-size: 12px;
        text-transform: uppercase;
        color: rgba(233, 244, 255, 0.70);
        margin-bottom: 6px;
      }

      .stat strong {
        font-size: 18px;
        color: #ffffff;
        text-shadow: 0 0 10px rgba(168, 85, 255, 0.72);
      }

      @media (max-width: 760px) {
        .stage {
          padding: 16px;
        }

        main {
          grid-template-columns: 1fr;
        }

        .progress-card {
          order: -1;
        }

        a.button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <section class="stage">
      <div class="shade"></div>

      <main>
        <section class="hero" aria-labelledby="title">
          <div class="mark">All or Nothing</div>
          <h1 id="title">KAMIKAZE GAMES</h1>
          <p class="subline">
            <span class="arrows">&darr;&darr;</span>
            Everything you need to know
            <span class="arrows">&darr;&darr;</span>
          </p>
          <div class="actions">
            <a class="button" id="gamesLink" href="https://t.me/KAMIKAZEGAMES" target="_blank" rel="noreferrer">
              Enter KAMIKAZE GAMES
            </a>
          </div>
        </section>

        <aside class="progress-card" aria-label="Project progress">
          <h2>Temple Progress</h2>
          <div class="amount">
            <strong id="raised">$0</strong>
            <span id="goal">$1,000 goal</span>
          </div>
          <div class="meter" aria-hidden="true">
            <div class="fill" id="fill"></div>
          </div>
          <div class="stats">
            <div class="stat">
              <span>Donors</span>
              <strong id="donors">0</strong>
            </div>
            <div class="stat">
              <span>Confirmed</span>
              <strong id="confirmed">0 SOL</strong>
            </div>
          </div>
        </aside>
      </main>
    </section>

    <script>
      const config = {
        gamesUrl: "https://t.me/KAMIKAZEGAMES",
        goalUsd: 1000,
        raisedUsd: 0,
        donors: 0,
        confirmedSol: 0
      };

      const progress = Math.max(0, Math.min(100, (config.raisedUsd / config.goalUsd) * 100));
      document.documentElement.style.setProperty("--progress", `${progress}%`);
      document.getElementById("gamesLink").href = config.gamesUrl;
      document.getElementById("raised").textContent = `$${config.raisedUsd.toLocaleString()}`;
      document.getElementById("goal").textContent = `$${config.goalUsd.toLocaleString()} goal`;
      document.getElementById("donors").textContent = config.donors.toLocaleString();
      document.getElementById("confirmed").textContent = `${config.confirmedSol} SOL`;

    </script>
  </body>
</html>
