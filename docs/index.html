<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KAMIKAZE GAMES</title>
    <style>
      :root {
        --cyan: #00e7ff;
        --red: #ff1e4d;
        --purple: #a855ff;
        --green: #24ff9a;
        --progress: 0%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #02030a;
        font-family: "Orbitron", "Eurostile", "Bank Gothic", "Arial Black", Arial, Helvetica, sans-serif;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: block;
        padding: 18px;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.44)),
          url("./kmk.png") center top / contain no-repeat;
        background-color: #02030a;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(0, 231, 255, 0.18), transparent 28%),
          radial-gradient(circle at 48% 64%, rgba(255, 30, 77, 0.18), transparent 30%);
        pointer-events: none;
      }

      .center {
        position: relative;
        z-index: 1;
        width: min(560px, 100%);
        display: grid;
        gap: 12px;
        justify-items: center;
        position: absolute;
        left: 50%;
        top: 59%;
        transform: translate(-50%, -50%);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        width: min(300px, 82vw);
        padding: 0 16px;
        border: 1px solid rgba(0, 231, 255, 0.86);
        border-radius: 8px;
        color: #ffffff;
        background: rgba(0, 0, 0, 0.10);
        backdrop-filter: blur(4px);
        box-shadow:
          0 0 18px rgba(0, 231, 255, 0.82),
          0 0 40px rgba(168, 85, 255, 0.62),
          0 0 64px rgba(255, 30, 77, 0.42),
          inset 0 0 18px rgba(255, 255, 255, 0.18);
        font-size: clamp(13px, 2.8vw, 18px);
        font-weight: 900;
        letter-spacing: 0;
        text-decoration: none;
        text-transform: uppercase;
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.88),
          0 0 18px rgba(0, 231, 255, 0.82);
        transition: transform 160ms ease, filter 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        filter: brightness(1.2) saturate(1.18);
      }

      .progress {
        width: min(320px, 82vw);
        height: 8px;
        border: 1px solid rgba(0, 231, 255, 0.72);
        background: rgba(0, 0, 0, 0.54);
        box-shadow:
          0 0 16px rgba(0, 231, 255, 0.46),
          inset 0 0 14px rgba(0, 231, 255, 0.24);
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: var(--progress);
        background: linear-gradient(90deg, var(--red), var(--purple), var(--cyan), var(--green));
        box-shadow:
          0 0 14px rgba(0, 231, 255, 0.9),
          0 0 28px rgba(168, 85, 255, 0.74);
      }

      @media (max-width: 760px) {
        .stage {
          background-position: center top;
        }

        .center {
          top: 58%;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="center" aria-label="KAMIKAZE GAMES entry">
        <a class="button" id="gamesLink" href="https://t.me/KAMIKAZE_THEBUNKER" target="_blank" rel="noreferrer">
          BLAST-OFF
        </a>
        <div class="progress" aria-label="Progress">
          <div class="fill"></div>
        </div>
      </section>
    </main>

    <audio id="soundtrack" src="./Kamikaze.mp3" preload="auto" autoplay loop></audio>

    <script>
      const config = {
        gamesUrl: "https://t.me/KAMIKAZE_THEBUNKER",
        progressPercent: 0
      };

      document.getElementById("gamesLink").href = config.gamesUrl;
      document.documentElement.style.setProperty("--progress", `${Math.max(0, Math.min(100, config.progressPercent))}%`);

      const soundtrack = document.getElementById("soundtrack");
      const startSoundtrack = () => {
        soundtrack.volume = 0.72;
        soundtrack.play().catch(() => {});
      };

      window.addEventListener("load", startSoundtrack);
      window.addEventListener("pointerdown", startSoundtrack, { once: true });
      window.addEventListener("keydown", startSoundtrack, { once: true });
    </script>
  </body>
</html>
