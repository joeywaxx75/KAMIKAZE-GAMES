<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KAMIKAZE GAMES</title>
    <style>
      :root {
        --cyan: #00e7ff;
        --red: #ff1e4d;
        --purple: #a855ff;
        --green: #24ff9a;
        --progress: 0%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #02030a;
        font-family: "Orbitron", "Eurostile", "Bank Gothic", "Arial Black", Arial, Helvetica, sans-serif;
      }

      .stage {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.18), rgba(0, 0, 0, 0.68)),
          url("./kmk.png") center top / cover no-repeat;
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(0, 231, 255, 0.18), transparent 28%),
          radial-gradient(circle at 48% 64%, rgba(255, 30, 77, 0.18), transparent 30%);
        pointer-events: none;
      }

      .center {
        position: relative;
        z-index: 1;
        width: min(560px, 100%);
        display: grid;
        gap: 22px;
        justify-items: center;
        margin-top: min(42vh, 380px);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 62px;
        width: min(420px, 100%);
        padding: 0 26px;
        border: 1px solid rgba(0, 231, 255, 0.86);
        border-radius: 8px;
        color: #ffffff;
        background:
          linear-gradient(90deg, rgba(255, 30, 77, 0.88), rgba(168, 85, 255, 0.9), rgba(0, 231, 255, 0.88));
        box-shadow:
          0 0 18px rgba(0, 231, 255, 0.82),
          0 0 40px rgba(168, 85, 255, 0.62),
          0 0 64px rgba(255, 30, 77, 0.42),
          inset 0 0 18px rgba(255, 255, 255, 0.18);
        font-size: clamp(18px, 4vw, 28px);
        font-weight: 900;
        letter-spacing: 0;
        text-decoration: none;
        text-transform: uppercase;
        text-shadow:
          0 0 8px rgba(255, 255, 255, 0.88),
          0 0 18px rgba(0, 231, 255, 0.82);
        transition: transform 160ms ease, filter 160ms ease;
      }

      .button:hover {
        transform: translateY(-2px);
        filter: brightness(1.2) saturate(1.18);
      }

      .progress {
        width: min(460px, 92vw);
        height: 16px;
        border: 1px solid rgba(0, 231, 255, 0.72);
        background: rgba(0, 0, 0, 0.54);
        box-shadow:
          0 0 16px rgba(0, 231, 255, 0.46),
          inset 0 0 14px rgba(0, 231, 255, 0.24);
        overflow: hidden;
      }

      .fill {
        height: 100%;
        width: var(--progress);
        background: linear-gradient(90deg, var(--red), var(--purple), var(--cyan), var(--green));
        box-shadow:
          0 0 14px rgba(0, 231, 255, 0.9),
          0 0 28px rgba(168, 85, 255, 0.74);
      }

      @media (max-width: 760px) {
        .stage {
          background-position: center top;
        }

        .center {
          margin-top: min(48vh, 420px);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <section class="center" aria-label="KAMIKAZE GAMES entry">
        <a class="button" id="gamesLink" href="https://t.me/KAMIKAZEGAMES" target="_blank" rel="noreferrer">
          Enter KAMIKAZE GAMES
        </a>
        <div class="progress" aria-label="Progress">
          <div class="fill"></div>
        </div>
      </section>
    </main>

    <script>
      const config = {
        gamesUrl: "https://t.me/KAMIKAZEGAMES",
        progressPercent: 0
      };

      document.getElementById("gamesLink").href = config.gamesUrl;
      document.documentElement.style.setProperty("--progress", `${Math.max(0, Math.min(100, config.progressPercent))}%`);
    </script>
  </body>
</html>
